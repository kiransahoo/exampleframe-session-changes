# ================================================================
# #ExampleFrame# 2.0 - Helm Values
# ================================================================
# NO SECRETS IN THIS FILE - passes security scans.
#
# STEP 1: Create namespace
#   kubectl create namespace #exampleframe#
#
# STEP 2: Create secrets on cluster (one-time, never in git)
#   kubectl apply -f secrets.yaml -n #exampleframe#
#   (or use kubectl create secret generic - see README)
#
# STEP 3: Deploy
#   Local:  helm install #exampleframe# ./#exampleframe#-chart -n #exampleframe#
#   AKS:    helm install #exampleframe# ./#exampleframe#-chart -n #exampleframe# -f values-aks.yaml
# ================================================================

namespace: #exampleframe#
secretName: #exampleframe#-secrets

# ============================================================
# Runtime agent-instance registration (POST /api/settings/agent-instances).
# Registering a URL makes that host internal - the service token is attached to it - so the
# URL an admin may register is restricted. In-cluster there is no reason for an agent to sit
# on loopback or a directly reachable private address; set true only for local development.
routing:
  allowPrivateUrls: false
  # Optional belt-and-braces: a regex the registered origin must match, e.g.
  #   instanceUrlPattern: "https?://[a-z0-9-]+\\.tb\\.svc(:\\d+)?"
  instanceUrlPattern: ""

# Deployment shape (see docs/multi-agent-routing.md section 2 and 5)
#   role: single -> one orchestrator + agents (Shape 1)
#   role: cell   -> a domain cell: orchestrator + this domain's agents; the meta delegates to it
#   role: meta   -> the meta-orchestrator only (no agents here); routes domains to cells
# ============================================================
federation:
  role: single
  cellName: ""                 # role=cell: domain name, e.g. claims -> A2A card orchestrator_agent__claims
  findingsIsolation: true      # role=meta: a cell only ever sees its own prior findings
  cells: []                    # role=meta: one entry per domain cell
  #  - name: claims
  #    url: http://orchestrator-agent.tb-claims.svc.cluster.local:8081
  #    allowedGroups: ""       # comma-separated Entra group ids; empty = every authenticated user
  #    description: "Claims domain cell"

# ============================================================
# Service mappings in git (optional; the Settings UI / store remains available). Keys are the
# same as the mapping editor: aliases, kubernetes.namespace, kubernetes.workload,
# kubernetes.cluster, oracle.schema, oracle.database, domain, ...
# ============================================================
serviceMappings: {}
#  payments-service:
#    aliases: "payments,payments-api"
#    kubernetes.namespace: payments
#    kubernetes.workload: payments-api
#    kubernetes.cluster: payments-prod

# ============================================================
# Security (all roles). The shared service token comes from secretName/TB_SERVICE_TOKEN.
# ============================================================
# Network confinement: datastores only reachable from #ExampleFrame# pods, agents only
# from the orchestrator. Disable only on clusters without a NetworkPolicy-capable CNI.
networkPolicies:
  enabled: true
  # extra ingress rules for the agent policy (e.g. a monitoring namespace scraping metrics)
  extraAgentIngress: []

nacos:
  authEnabled: true   # registry auth (NACOS_AUTH_TOKEN in the secret is required)

security:
  auth:
    enabled: false             # Entra JWT on /api/** (set the ids when true)
    tenantId: ""
    clientId: ""
    viewerGroups: ""
    operatorGroups: ""
    adminGroups: ""
  incidentIntakeKeyInSecret: true   # INCIDENT_INTAKE_API_KEY read from secretName if present

# ============================================================
# Provisioning agent instances from the Settings UI (orchestrator creates pods in its namespace)
# ============================================================
provisioning:
  enabled: false
  kubernetesImage: ""          # empty = images.agents.kubernetes

# ============================================================
# Images
# ============================================================
images:
  pullPolicy: Never
  registry: ""
  agents:
    orchestrator: "*/#exampleframe#-orchestrator-agent:latest"
    kubernetes: "*/#exampleframe#-kubernetes-agent:latest"
    oracle: "*/#exampleframe#-oracle-agent:latest"
    azureMonitor: "*/#exampleframe#-azure-monitor-agent:latest"
    dbt: "*/#exampleframe#-dbt-agent:latest"
  infra:
    mongo: mongo:7.0
    redis: redis:7.2-alpine
    nacos: nacos/nacos-server:latest

# ============================================================
# Cassandra
# ============================================================
# Connection info for an externally-hosted (or in-cluster) Cassandra cluster.
# These keys are rendered as CASSANDRA_* env vars in each agent deployment and
# override the `${CASSANDRA_*:default}` placeholders in application.yaml.
# Leave username/password empty for unauthenticated local/dev clusters.
cassandra:
  contactPoints: "cassandra.cassandra.svc.cluster.local"
  port: "9042"
  keyspace: "#exampleframe#"
  localDatacenter: "datacenter1"
  username: ""
  password: ""

# ============================================================
# MongoDB (legacy - kept for jvm-agent until it migrates to Cassandra)
# ============================================================
mongodb:
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  storage: 10Gi

# ============================================================
# Redis
# ============================================================
redis:
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ============================================================
# Nacos
# ============================================================
nacos:
  jvmXms: "256m"
  jvmXmx: "512m"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# ============================================================
# Agent defaults
# ============================================================
agentDefaults:
  profile: "openai"
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  probes:
    readinessInitialDelay: 90
    livenessInitialDelay: 120

# ============================================================
# Kubernetes Agent
# ============================================================
# Kubernetes agent = Kubernetes + JVM diagnostics (thread/heap/GC/JFR via sidecar); there is no
# separate JVM agent to enable.
kubernetesAgent:
  enabled: true
  # SHARED cluster (meta + cells as namespaces on ONE cluster): list the namespaces this
  # DOMAIN's workloads live in. The agent then gets namespaced Roles there instead of the
  # cluster-wide ClusterRole, so one domain's agent cannot read another domain's pods or
  # secrets. Empty = dedicated-cluster default: cluster-wide read plus the agent's
  # diagnostic verbs (pod delete, exec, ephemeral containers, scale patch; nodes/
  # namespace views included), with the ClusterRole name suffixed by the release namespace so multiple
  # releases on one cluster never collide. Mutually exclusive with kubeconfigSecret
  # (remote mode needs no grant here at all); setting both fails the render.
  watchNamespaces: []
  #  - claims
  #  - claims-batch
  # The default agent is "this cluster": in-cluster ServiceAccount, card kubernetes_agent. Keep it
  # unnamed. (kubeconfigSecret/kubeContext may point it at another cluster if this one is not a target.)
  kubeconfigSecret: ""
  kubeContext: ""
  # Additional clusters for this domain: one agent pod per entry, registered as
  # kubernetes_agent__<key>, bound via a Secret holding that cluster's SA-token kubeconfig under
  # key "kubeconfig". Wired into the orchestrator automatically (no restart needed beyond the rollout).
  instances: []
  #  - key: payments-prod
  #    kubeconfigSecret: k8s-agent-payments-prod-kubeconfig
  #    context: payments-prod
  port: 8082
  enableWriteOps: "true"
  enableHumanApproval: "true"
  contextWindow: "10"
  logging:
    root: "INFO"
    agent: "DEBUG"

# ============================================================
# Oracle Agent
# ============================================================
oracleAgent:
  enabled: true
  # Additional databases: one agent pod per entry, registered as oracle_agent__<key>; each reads
  # ORACLE_JDBC_URL / ORACLE_USER / ORACLE_PASSWORD from its own Secret (key names unchanged).
  instances: []
  #  - { key: claims-db,   secretName: oracle-claims-db }
  #  - { key: billing-db,  secretName: oracle-billing-db, mockMode: "false" }
  port: 8083
  mockMode: "false"
  writeOpsEnabled: "true"
  humanApprovalEnabled: "true"
  contextWindow: "10"
  a2a:
    taskIsolation: "true"
    freshContext: "true"
    deduplicateSystemMessages: "true"
    checkpointTtlHours: "24"
    maxCheckpointSize: "8000000"
  logging:
    root: "INFO"
    agent: "DEBUG"
    a2a: "DEBUG"
    alibaba: "INFO"

# ============================================================
# Azure Monitor Agent
# ============================================================
azureMonitorAgent:
  enabled: true
  # Additional workspaces / App Insights resources: one pod per entry, azure_monitor_agent__<key>;
  # each reads AZURE_WORKSPACE_ID / TENANT_ID / CLIENT_ID / CLIENT_SECRET (+ subscription,
  # resource group, instrumentation key) from its own Secret.
  instances: []
  #  - { key: claims-ai,  secretName: azure-claims-ai,  appName: claims-insights }
  port: 8084
  # Non-secret Azure config
  azureWorkspaceId: ""          # set per deployment / per instance
  azureTenantId: ""
  azureSubscriptionId: ""
  azureResourceGroup: ""
  azureAppName: "#exampleframe#-insights"
  azureInstrumentationKey: ""   # prefer the secret (AZURE_INSTRUMENTATION_KEY)
  # VCS non-secret config
  vcsProvider: "github"
  githubOwner: "kiransahoo"
  githubRepo: "order-service-demo"
  githubBranch: "main"
  appPackages: "com.acme"
  logging:
    root: "INFO"
    agent: "DEBUG"
    alibaba: "DEBUG"

# ============================================================
# dbt Agent (off by default; a cell that owns dbt pipelines enables it)
# ============================================================
dbtAgent:
  enabled: false
  # Additional dbt projects: one pod per entry, dbt_agent__<key>; DBT_API_TOKEN from its own Secret.
  instances: []
  #  - { key: analytics, secretName: dbt-analytics, apiBaseUrl: "http://dbt-analytics:9000" }
  port: 8085
  apiBaseUrl: "http://dbt-api:9000"
  mockMode: "true"
  writeOpsEnabled: "true"
  humanApprovalEnabled: "true"
  contextWindow: "10"
  a2a:
    taskIsolation: "true"
    freshContext: "true"
    deduplicateSystemMessages: "true"
    checkpointTtlHours: "24"
    maxCheckpointSize: "8000000"
  logging:
    root: "INFO"
    agent: "DEBUG"
    a2a: "DEBUG"
    alibaba: "INFO"

# ============================================================
# Extra agents (GENERIC) - add a NEW agent TYPE with no new template or helper edit.
# ============================================================
# A new domain that needs an agent type the chart doesn't ship built-in (postgresql,
# mysql, splunk, a home-grown one...) is defined entirely here: build the agent image,
# then add an entry. The chart renders its Service + Deployment AND the orchestrator's
# remote-agent config (delegation tool + parameters), so the orchestrator can route to
# it and the mapping UI shows its fields - all from this map. Keyed by agent name (the
# routing prefix, e.g. `postgresql` -> postgresql.schema / postgresql.database).
#
# extraAgents:
#   postgresql:
#     enabled: true
#     image: myregistry/#exampleframe#-postgresql-agent:1.0.0   # full ref, or set images.registry + repo
#     port: 8098
#     toolName: delegateToPostgresqlAgent                    # optional; default delegateTo<Name>Agent
#     description: "PostgreSQL diagnostics - sessions, locks, slow queries"
#     layer: data                                            # optional
#     serviceAccount: #exampleframe#-agent-min                   # min | #exampleframe#-k8s-agent
#     # delegation parameters the orchestrator passes + the mapping UI renders as fields.
#     # task/timeRange are per-question; the rest become service-mapping fields.
#     parameters:
#       task: "Pass the user's CURRENT message exactly"
#       schema: "Database schema, from the service mapping"
#       tables: "Tables this service owns, from the mapping"
#     # task/timeRange/service/priorFindings/buildId are per-question - every OTHER
#     # parameter becomes a service-mapping field. Names must not collide with the
#     # built-ins or platform components (kubernetes/oracle/azure-monitor/dbt/jvm/
#     # orchestrator/nacos/mongodb/redis/cassandra) - the chart fails the render.
#     # routing key (<name>.<param>) is decided by the orchestrator's RoutingKeyResolver:
#     # postgresql/postgres/mysql/oracle -> database, kubernetes/jvm -> cluster, else -> instance.
#     # A brand-new convention needs a one-line addition there; DB/generic types work as-is.
#     instances: []                                          # optional: [{ key: xyz-db }] -> one pod each, postgresql_agent__<key>
#     env: []                                                # optional plain env: [{ name: PG_SSLMODE, value: require }]
#     secretEnv: []                                          # optional secret env: [{ name: PG_PASSWORD, key: PG_PASSWORD }] (from secretName)
extraAgents: {}

# ============================================================
# Orchestrator Agent
# ============================================================
orchestratorAgent:
  port: 8081
  enableHumanApproval: "true"
  contextWindow: "15"
  agentTimeout: "60"
  logging:
    root: "INFO"
    agent: "DEBUG"

# ============================================================
# CNF Proxy (disabled for local dev)
# ============================================================
proxy:
  host: ""
  port: "3128"

# ============================================================
# Ingress
# ============================================================
ingress:
  enabled: false
  className: nginx
  host: ""                          # e.g., #exampleframe#.acme.net (leave empty for IP-only access)
  loadBalancerIP: ""                # e.g., 20.120.50.100 (your static Azure public IP)
  annotations: {}
    # Example annotations:
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # nginx.ingress.kubernetes.io/proxy-body-size: "50m"

# ============================================================
# SSL / TLS (via Cert Manager)
# ============================================================
ssl:
  enabled: false
  certSecretName: #exampleframe#-tls
  certManager:
    enabled: false
    certificateName: #exampleframe#-cert
    issuerName: ""
    issuerKind: ClusterIssuer
    commonName: #exampleframe#.local
    duration: "2160h"       # 90 days
    renewBefore: "360h"     # 15 days
    dnsNames: []
