# Orchestrator config rendered from values and mounted at /config/application-cluster.yaml
# (profile "cluster"): kubernetes agent instances, service mappings, and - for role=meta - the
# federation block (domain -> cell). Dashed map keys cannot be passed reliably as env vars, so
# this file carries them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
  namespace: {{ .Values.namespace }}
data:
  application-cluster.yaml: |
    #exampleframe#:
      orchestrator:
        routing:
          # A runtime agent instance is fetched by this orchestrator (card verification, health
          # probes) and, once registered, counts as an internal host that the service token is
          # attached to. In a cluster an agent is never on loopback or an RFC1918 address that
          # this pod can reach directly, so refusing them removes an admin's ability to aim that
          # egress at the pod network. Local development keeps the permissive code default.
          allow-private-urls: {{ .Values.routing.allowPrivateUrls | default false }}
{{- if .Values.routing.instanceUrlPattern }}
          instance-url-pattern: {{ .Values.routing.instanceUrlPattern | quote }}
{{- end }}
{{- if include "#exampleframe#.isMeta" . }}
        federation:
          enabled: true
          findings-isolation: {{ .Values.federation.findingsIsolation }}
          domains:
{{- range .Values.federation.cells }}
            {{ .name }}:
              agent-key: {{ .name }}-cell
              allowed-groups: {{ .allowedGroups | default "" | quote }}
{{- end }}
{{- end }}
{{- $hasExtra := and (ne .Values.federation.role "meta") .Values.extraAgents }}
{{- $hasInst := or .Values.kubernetesAgent.instances .Values.oracleAgent.instances .Values.azureMonitorAgent.instances .Values.dbtAgent.instances }}
{{- if or (include "#exampleframe#.isMeta" .) $hasInst $hasExtra }}
        remote-agents:
{{- if include "#exampleframe#.isMeta" . }}
{{- range .Values.federation.cells }}
          {{ .name }}-cell:
            url: {{ .url | quote }}
            name: orchestrator_agent__{{ .name }}
            description: {{ .description | default (printf "%s domain #ExampleFrame# cell - full investigation stack for %s services" (title .name) .name) | quote }}
            timeout-seconds: {{ $.Values.orchestratorAgent.cellTimeout | default 4000 }}
            retry-count: 3
            layer: domain
            investigation-priority: 1
            tool-name: delegateTo{{ title .name }}Cell
            when-to-use: "Any investigation for a service owned by the {{ title .name }} domain"
            capabilities:
              - full-domain-investigation
            parameters:
              task: "The investigation to run in the {{ .name }} cell"
              service: "The affected service name"
{{- end }}
{{- end }}
{{- if include "#exampleframe#.agentsEnabled" . }}
{{- $proto := include "#exampleframe#.protocol" . }}
{{- if and .Values.kubernetesAgent.enabled .Values.kubernetesAgent.instances }}
          kubernetes:
            instances:
{{- range .Values.kubernetesAgent.instances }}
              {{ required "kubernetesAgent.instances entries require a non-empty 'key'" .key }}:
                url: "{{ $proto }}://kubernetes-agent-{{ .key }}:{{ $.Values.kubernetesAgent.port }}"
{{- end }}
{{- end }}
{{- if and .Values.oracleAgent.enabled .Values.oracleAgent.instances }}
          oracle:
            instances:
{{- range .Values.oracleAgent.instances }}
              {{ required "oracleAgent.instances entries require a non-empty 'key'" .key }}:
                url: "{{ $proto }}://oracle-agent-{{ .key }}:{{ $.Values.oracleAgent.port }}"
{{- end }}
{{- end }}
{{- if and .Values.azureMonitorAgent.enabled .Values.azureMonitorAgent.instances }}
          azure-monitor:
            instances:
{{- range .Values.azureMonitorAgent.instances }}
              {{ required "azureMonitorAgent.instances entries require a non-empty 'key'" .key }}:
                url: "{{ $proto }}://azure-monitor-agent-{{ .key }}:{{ $.Values.azureMonitorAgent.port }}"
{{- end }}
{{- end }}
{{- if and .Values.dbtAgent.enabled .Values.dbtAgent.instances }}
          dbt:
            instances:
{{- range .Values.dbtAgent.instances }}
              {{ required "dbtAgent.instances entries require a non-empty 'key'" .key }}:
                url: "{{ $proto }}://dbt-agent-{{ .key }}:{{ $.Values.dbtAgent.port }}"
{{- end }}
{{- end }}
{{- /* GENERIC: full remote-agent definition for each extra agent type, so the
       orchestrator builds its delegation tool + mapping fields from config alone. */ -}}
{{- range $name, $a := .Values.extraAgents }}
{{- if eq (printf "%v" $a.enabled) "true" }}
          {{ $name }}:
            url: "{{ $proto }}://{{ $name }}-agent:{{ $a.port }}"
            name: {{ printf "%s_agent" $name | quote }}
            description: {{ $a.description | default (printf "%s agent" $name) | quote }}
            timeout-seconds: {{ $a.timeoutSeconds | default 4000 }}
            retry-count: 3
            layer: {{ $a.layer | default "data" | quote }}
            tool-name: {{ $a.toolName | default (printf "delegateTo%sAgent" (title $name)) | quote }}
            parameters:
{{- range $pk, $pv := ($a.parameters | default (dict "task" "Pass the user's CURRENT message exactly")) }}
              {{ $pk }}: {{ $pv | quote }}
{{- end }}
{{- if $a.instances }}
            instances:
{{- range $a.instances }}
              {{ required (printf "extraAgents.%s.instances entries require a non-empty 'key'" $name) .key }}:
                url: "{{ $proto }}://{{ $name }}-agent-{{ .key }}:{{ $a.port }}"
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.serviceMappings }}
        app-context:
          services:
{{- range $svc, $ctx := .Values.serviceMappings }}
            {{ $svc }}:
{{- range $k, $v := $ctx }}
              {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- end }}
